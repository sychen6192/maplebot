# 弓箭手訓練場 II —— GUI 錄製直接產出的結果，**還不能直接用**。
#
# 42 個點裡有 21 個不同的 y。這張圖沒有 21 層樓：爬繩途中小地圖 y 是一格一格
# 變的，中途每個高度都被記成一層樓（看 104->100->96->92->88 那段就是一次爬繩）。
# route.py 已經要求「y 要停住幾筆才算到位」，但慢慢爬的時候每個中途高度都會
# 停超過那個門檻，所以還是漏過去了——這份留著當實際樣本，修好之後拿它驗證。
#
# 要現在就掛的話，先把中途的高度刪掉只留真正的樓層，或整段換成 waypoints: auto。
