# 地圖/職業 profile 範例：左右兩點巡邏，範圍內有怪就打
name: "範例：左右巡邏"

templates_dir: "data/templates/mobs"   # 用 tools/grab_template.py 蒐集怪物模板

# HP 進入危險線時先按回城卷再停止（留空 = 直接停止）
panic_return_key: ""

patrol:
  # 巡邏點四種寫法可混用：
  #   40            -> 小地圖絕對 x（px）
  #   0.75          -> 佔小地圖寬度比例（小地圖大小改變也不用重寫）
  #   {x: 95, keys: [alt]} -> 抵達時依序敲鍵（放置技能等）
  #   {x: 68, y: 20}       -> 多層地圖：x 對準後爬繩到 y（見 multilevel.yaml）
  #
  # 懶人寫法：整行換成 `waypoints: auto`，開場會左右各走到撞牆量出可走範圍，
  # 自動生成兩個巡邏點——單層練功地圖不用先量座標。
  waypoints: [40, 95]
  tolerance: 4              # 距離巡邏點多少 px 內算抵達
  step_seconds_per_px: 0.02 # 每差 1px 走多久（依角色移速微調）
  max_step_seconds: 0.45    # 單次最長走多久（走一步→重新看位置，閉迴路）
  stuck_seconds: 4.0        # 移動中位置卡住超過幾秒就跳一下脫困
  stuck_px: 3
  jump_key: alt             # 脫困用跳躍鍵
  # waypoints: auto 的探邊參數（用預設就好，走不出來再調）
  # probe_seconds: 0.35     # 每次往同方向試探走多久
  # probe_stalls: 3         # 連續幾次位置沒變判定撞牆
  # probe_margin_px: 6      # 量到的邊界往內縮多少當巡邏點
  # probe_min_span_px: 12   # 量到的範圍小於此值 -> 判定校正失敗並停機

attack:
  key: x                    # 攻擊/技能鍵
  type: directional         # directional = 先轉向再打；aoe = 原地放（祭司/主教的技能）
  range_px: 320             # 怪物離畫面中心（≈角色）多少 px 內才攻擊
  vertical_range_px: 90     # 垂直容許範圍（避免打不到樓上樓下的怪）
  cast_seconds: 0.6         # 按住攻擊鍵的時間
  repeat: 2                 # 一次決策連續施放幾下
  cooldown: 0.2

buffs:
  - key: "8"                # buff 鍵
    every: 120              # 每幾秒補一次
    cast_seconds: 1.5

potions:
  hp: { key: pageup,   below_ratio: 0.50, cooldown: 1.0 }
  mp: { key: pagedown, below_ratio: 0.30, cooldown: 1.0 }
