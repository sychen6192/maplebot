name: 弓箭手訓練場一（1366x768）
templates_dir: data/templates/mobs
panic_return_key: ''
patrol:
  # 2026-10-11 在 1366x768 client 上重錄（logs/route_rec/route3.jsonl，t=36.5 起走一圈）。
  # 這個解析度的小地圖只有 2560x1440 時的一半大，x 和 y 都以 2px 為一格。
  # 原本 弓箭手訓練場一.yaml 的 x 約等於這裡的 2 倍減 11（繩 137<->74、98<->54），
  # 樓層 172/136/108 對到這裡的 90/72/56。
  #
  # 樓層是照「實際停留多久」挑的，不是 route.compress 預設的「y 停 3 筆」：
  # 這裡爬繩每 0.2 秒 y 只動 2px，含停頓平均約 1.3px，剛好落在 y_tolerance 2 之內。
  # 預設規則因此把爬繩途中的 84/78/66/60/70 都錄成樓層，3 層的圖錄出 8 層。
  # 走路線期間的停留：地面 217 筆、二層 30 筆、三層 68 筆，其他高度都 <=4 筆。
  # 下跳是看單筆下降速度判定的：非提權錄製看不到 alt，compress 不會自己標 jump。
  # 跳的每 0.2 秒掉 6~8px，爬繩是 2px。
  waypoints:
  - x: 24                 # 地面左端。實錄走到左牆 x=4，但 x<45 鏡頭被地圖邊緣卡住、角色
    y: 90                 # 不在畫面中央，名牌被寵物名字蓋住時就退回「畫面中央」，把自己
    descend: jump         # 框成怪往左追——追擊沒有撞牆保護，實機在 x=4 卡了 50 秒。
                          # 24 讓追擊左界變 16。descend: jump 只在從上層開跑時有作用：
                          # 直接跳下來，不會在二層找繩往下爬（實機卡了 30 秒）
  - x: 74                 # 走到地面 -> 二層的繩
    y: 90
  - x: 74                 # 爬上二層。實錄只看過在讀值 74 抓到繩（第一步就升 4px，
    y: 72                 # 可能是跳抓）。tolerance 2 從左邊過來讀到 72 就會起跳、
    tolerance: 1          # 偏左約 1px，所以收緊到只接受 74
  - x: 50                 # 二層往左。實錄這裡是起跳助跑點，不是掃怪端點
    y: 72
  - x: 54                 # 二層 -> 三層的繩：實錄從 x=50 助跑跳起、在 54 抓到。原圖上
    y: 56                 # 是 98「整」、99~102 全抓不到的那條，一格讀值 54 涵蓋原圖
    tolerance: 1          # 約 95~99。FSM 是站定跳抓，不是助跑，可能要重試幾次
  - x: 34                 # 三層左掃（菇菇寶貝）
    y: 56
  - x: 102                # 三層右掃（紅寶密集區）
    y: 56
  - x: 102                # 一路下跳回地面。實錄在 x=102 連跳三次：三層 -> 二層 -> 小木屋
    y: 90                 # 屋頂（y≈80）-> 地面。只放一個點、不在二層另設一個，因為那樣
    descend: jump         # 若一跳直接落到屋頂，目標 y=72 在上方，FSM 會在屋頂上找繩
  - x: 120                # 地面右段。實錄走到 140 沒被傳走（觸發點在更右邊、位置不明），
    y: 90                 # 以前 bot 撞右牆、追怪都被傳去訓練場 II。追擊截止線是端點
                          # +6+2 = 128，但追擊/巡邏拉鋸觸發的脫困跳會再往右送，模擬實際
                          # 到 133~137——離 140 已經不多，不要再往右放
  tolerance: 2
  # 1 而不是 2：小地圖 y 一格 2px，y_tolerance 2 會在繩上讀到 74（目標 72）、
  # 58（目標 56）時就判定到了，接著按方向鍵——掛在繩上按方向鍵不會動，要等
  # 4 秒卡住脫困從繩上亂跳。站著的抖動只有地面 90/91，1 擋得住
  y_tolerance: 1
  # 原值 0.02 是在兩倍大的小地圖上訂的，等比換算是 0.04；短距離仍是點按，
  # tolerance 1 的繩點不會衝過頭（實際走速約 7.7px/秒，別照物理值調到 0.13）
  step_seconds_per_px: 0.04
  max_step_seconds: 0.45
  stuck_seconds: 4.0
  stuck_px: 3
  jump_key: alt
  climb_up_key: up
  climb_down_key: down
  # 實錄爬繩含停頓平均約 6.3px/秒，0.8 秒一步約升 5px，仍高於 climb_stall_px 2
  climb_seconds: 0.8
loot:
  key: z
  every: 3.0
  taps: 3
  after_combat: 6.0
attack:
  key: ctrl
  min_mp: 0.0
  min_mobs: 1
  type: directional
  range_px: 55
  vertical_range_px: 35
  cast_seconds: 0.45
  repeat: 1
  cooldown: 0.1
buffs: []
potions:
  hp:
    key: s
    below_ratio: 0.7
    cooldown: 0.5
  mp:
    key: a
    below_ratio: 0.3
    cooldown: 1.0
attack_auto_scale: true
# 280（約畫面 1/3）在這張圖上永遠有怪在範圍內，巡邏輪不到：實機 4 分鐘 559 次
# 追擊、只有 37 次巡邏，連第一個點都沒走完。120 時一圈約 3 分 44 秒（含打怪）
chase_px: 120
