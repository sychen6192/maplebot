name: 弓箭手訓練場一
templates_dir: data/templates/mobs
panic_return_key: ''
patrol:
  # 訓練場 I 的地面層。右邊緣（小地圖 x≈245+）是通往訓練場 II 的
  # **自動傳送門**——walk-through 就換圖，所以右端點刻意停在 200：
  # 用 auto 探邊或把端點寫到 215 都實測踩進門把自己傳走（黑屏那下就是）。
  # 左端點 30 是牆內安全距離（牆在 x≈15）。
  waypoints:
  - 30
  - 200
  tolerance: 4
  y_tolerance: 2
  step_seconds_per_px: 0.02
  max_step_seconds: 0.45
  stuck_seconds: 4.0
  stuck_px: 3
  jump_key: alt
  climb_up_key: up
  climb_down_key: down
loot:
  key: z
  every: 3.0
  taps: 3
  after_combat: 6.0
attack:
  key: ctrl
  min_mp: 0.0
  min_mobs: 1
  type: directional
  range_px: 55
  vertical_range_px: 35
  cast_seconds: 0.45
  repeat: 1
  cooldown: 0.1
buffs: []
potions:
  hp:
    key: s
    below_ratio: 0.7
    cooldown: 0.5
  mp:
    key: a
    below_ratio: 0.3
    cooldown: 1.0
attack_auto_scale: true
chase_px: 280
