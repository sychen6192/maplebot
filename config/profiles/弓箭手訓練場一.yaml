name: 弓箭手訓練場一
templates_dir: data/templates/mobs
panic_return_key: ''
patrol:
  # 訓練場 I 的地面層。右邊緣（小地圖 x≈245+）是通往訓練場 II 的
  # **自動傳送門**——walk-through 就換圖，所以右端點刻意停在 200：
  # 用 auto 探邊或把端點寫到 215 都實測踩進門把自己傳走（黑屏那下就是）。
  # 左端點 30 是牆內安全距離（牆在 x≈15）。
  # 多層路線（2026-08-11 實機量測）：地面 y=172、二層 y=136、三層 y=114。
  # 繩子：地面→二層在 x≈137（垂到近地面，站著按上就抓得到）、
  # 二層→三層在 x≈100（繩底離平台約半身高）。下樓一律下跳（descend: jump）。
  # 三層是菇菇寶貝＋紅寶區。二層跨距實測 46..214、三層 57..207，端點內縮。
  waypoints:
  - 45                    # 地面左段
  - x: 137                # 地面→二層：繩底貼地、抓取窗口寬（±2 實證可上），
    y: 136                # 不用收緊容差——地面人擠擊退多，對位太吹毛求疵反而慢
  - x: 62                 # 二層左段（滑怪區）。別貼太近左緣 46：被滑怪撞一下就掉下去
    y: 136
  - x: 98                 # 二層→三層：繩底 x=98 **整**（99~102 全抓不到，
    y: 108                # 窗口極窄；抓失敗就靠重試與下一圈再來）
    tolerance: 1
  - x: 60                 # 三層左掃（菇菇寶貝）
    y: 108
  - x: 190                # 三層右掃（紅寶密集區）
    y: 108
  - x: 195                # 下回二層：descend jump 會就地下跳再走到 195，
    y: 136                # 順路掃二層右半
    descend: jump
  - x: 200                # 下回地面（別超過 200：門在 245）
    y: 172
    descend: jump
  - 190                   # 地面右段收尾，接回左段 45
  tolerance: 2
  y_tolerance: 2
  step_seconds_per_px: 0.02
  max_step_seconds: 0.45
  stuck_seconds: 4.0
  stuck_px: 3
  jump_key: alt
  climb_up_key: up
  climb_down_key: down
  # 每步按住 up 久一點：0.45s 每 tick 只升 ~3px、貼著 climb_stall_px=2 的
  # 停滯門檻，辨識半拍就誤判掉繩。0.8s 每步升 ~6px，遠離門檻
  climb_seconds: 0.8
loot:
  key: z
  every: 3.0
  taps: 3
  after_combat: 6.0
attack:
  key: ctrl
  min_mp: 0.0
  min_mobs: 1
  type: directional
  range_px: 55
  vertical_range_px: 35
  cast_seconds: 0.45
  repeat: 1
  cooldown: 0.1
buffs: []
potions:
  hp:
    key: s
    below_ratio: 0.7
    cooldown: 0.5
  mp:
    key: a
    below_ratio: 0.3
    cooldown: 1.0
attack_auto_scale: true
chase_px: 280
